plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'io.sensinghub'
version = '0.1.0'

java {
    // 설치된 JDK 17 이상을 그대로 쓴다 (툴체인 자동 다운로드 없이 사내망에서도 빌드되도록)
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    // JDK가 더 높아도 Java 17에 없는 API를 쓰면 컴파일이 실패하게 한다
    options.release = 17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
        // CI처럼 로컬 DB가 없어 재현할 수 없는 곳에서 서버 쪽 예외(500의 원인)를 보려면 테스트 JVM의 표준 출력도 찍는다
        showStandardStreams = System.getenv('SENSING_TEST_STDOUT') == 'true'
    }
    // 통합 테스트는 SENSING_IT_DB_URL이 있을 때만 실행된다 (README 참고)
    environment 'SENSING_IT_DB_URL', System.getenv('SENSING_IT_DB_URL') ?: ''
}
