# 테스트 전용 덮어쓰기 (classpath:/config/ 는 main의 application.yml보다 우선한다. bootRun에는 없다).
# 통합 테스트는 클래스마다 Spring 컨텍스트를 캐시하고 컨텍스트마다 연결 풀을 열어 둔다. 기본 풀(10)이면 IT 9개만으로 90개라
# PostgreSQL 기본 한도(100, 관리자 몫 3)에 닿고, 같은 DB 서버를 쓰는 로컬 백엔드·워커가 있으면 "too many clients"로 기동이 실패한다.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
