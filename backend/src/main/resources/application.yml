spring:
  application:
    name: sensing-hub
  datasource:
    url: ${SENSING_DB_URL:jdbc:postgresql://localhost:5432/sensing}
    username: ${SENSING_DB_USER:sensing}
    password: ${SENSING_DB_PASSWORD:sensing}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    # 다이제스트 메일(SMTP). host가 비어 있으면 EMAIL 구독은 FAILED("메일 서버가 설정되지 않았습니다")로 남는다.
    host: ${SENSING_MAIL_HOST:}
    port: ${SENSING_MAIL_PORT:587}
    username: ${SENSING_MAIL_USERNAME:}
    password: ${SENSING_MAIL_PASSWORD:}
    properties:
      # 사내 릴레이(인증 없음, 25번 포트)면 SENSING_MAIL_AUTH=false SENSING_MAIL_STARTTLS=false
      mail.smtp.auth: ${SENSING_MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${SENSING_MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: ${SENSING_PORT:8080}
  servlet:
    encoding:
      # JSON 응답에도 "charset=UTF-8"을 붙인다. Spring은 application/json에 charset을 붙이지 않는데, 그러면 Windows PowerShell 5.1의
      # Invoke-RestMethod 같은 클라이언트가 ISO-8859-1로 읽어 한글이 "ì¹´ëë´ì¤"("카드뉴스")처럼 깨져 보인다 (저장된 값은 정상)
      charset: UTF-8
      force-response: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # 메일 헬스 체크를 끈다. 켜 두면 /actuator/health가 호출될 때마다 SMTP에 접속하고, 다이제스트 전송 실패는
      # digest_run에 따로 남는다. (테스트에서 JavaMailSender를 목으로 바꾸면 이 체크가 컨텍스트 기동을 막기도 한다)
      enabled: false

sensing:
  scheduler:
    # 주기 수집 대상 확인 간격
    tick-ms: ${SENSING_SCHEDULER_TICK_MS:60000}
    enabled: ${SENSING_SCHEDULER_ENABLED:true}
  digest:
    # 일간 다이제스트: 5분마다 KST 기준 현재 시각이 hour_kst인 구독 중 오늘 아직 보내지 않은 것을 보낸다
    enabled: ${SENSING_DIGEST_ENABLED:true}
    tick-ms: ${SENSING_DIGEST_TICK_MS:300000}
    # 보내는 메일 주소. 비우면 spring.mail.username, 그것도 비면 메일 서버가 정한다
    from: ${SENSING_MAIL_FROM:}
    # 웹훅 POST 제한 시간(초)
    webhook-timeout-seconds: 10
  caidentia:
    # 케이던시아(삼성SDS 구매 SaaS) 연동 — 지금은 우리 백엔드 안의 가짜 케이던시아(/mock/caidentia/api)를 본다.
    # 실제 API가 나오면 base-url·api-key만 바꾼다. enabled=false면 스케줄러(동기화·전달)만 멈추고 수동 API는 된다.
    enabled: ${SENSING_CAIDENTIA_ENABLED:true}
    base-url: ${SENSING_CAIDENTIA_BASE_URL:http://127.0.0.1:${server.port}/mock/caidentia/api}
    api-key: ${SENSING_CAIDENTIA_API_KEY:mock-key}
    # 공급사 마스터 동기화 시각 (KST, Spring cron 6자리). 기본 매일 06:00
    sync-cron: ${SENSING_CAIDENTIA_SYNC_CRON:0 0 6 * * *}
    # HIGH·MEDIUM 회사 신호를 리스크 이벤트로 전달 (5분마다)
    push-enabled: ${SENSING_CAIDENTIA_PUSH_ENABLED:true}
    push-tick-ms: ${SENSING_CAIDENTIA_PUSH_TICK_MS:300000}
    timeout-seconds: 10
    mock:
      # 가짜 케이던시아 서버를 띄운다 (실제 케이던시아를 보게 되면 끈다)
      enabled: ${SENSING_CAIDENTIA_MOCK_ENABLED:true}
  registration:
    # VIEWER가 등록하면 관리자 승인 대기로 접수한다
    viewer-needs-approval: true
  auth:
    # PoC 인증: X-User 헤더의 login_id로 사용자를 찾는다. SSO 연동 시 교체한다.
    default-user: ${SENSING_DEFAULT_USER:registrar}
  # 공개 API 자격 증명(api_credential)을 pgcrypto로 암호화하는 대칭키. 워커의 SENSING_SECRET_KEY와 같아야 한다.
  # 비어 있으면 자격 증명 API는 503을 낸다.
  secret-key: ${SENSING_SECRET_KEY:}
