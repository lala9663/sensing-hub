# 로컬 개발·PoC용 구성: PostgreSQL(+pgvector), Spring Boot 백엔드, Python 워커
# 실행: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sensing
      POSTGRES_USER: sensing
      POSTGRES_PASSWORD: sensing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensing -d sensing"]
      interval: 5s
      retries: 20
    command: ["postgres", "-c", "shared_buffers=1GB"]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SENSING_DB_URL: jdbc:postgresql://db:5432/sensing
      SENSING_DB_USER: sensing
      SENSING_DB_PASSWORD: sensing
      # 공개 API 키(api_credential)를 암호화하는 대칭키. 워커와 같은 값. 운영에서는 반드시 바꾼다
      SENSING_SECRET_KEY: ${SENSING_SECRET_KEY:-sensing-dev-secret}
      # 일간 다이제스트 메일(SMTP). 비우면 메일 구독은 FAILED로 남고 웹훅 구독만 보낸다 — README 참고
      SENSING_MAIL_HOST: ${SENSING_MAIL_HOST:-}
      SENSING_MAIL_PORT: ${SENSING_MAIL_PORT:-587}
      SENSING_MAIL_USERNAME: ${SENSING_MAIL_USERNAME:-}
      SENSING_MAIL_PASSWORD: ${SENSING_MAIL_PASSWORD:-}
      SENSING_MAIL_FROM: ${SENSING_MAIL_FROM:-}
      SENSING_MAIL_AUTH: ${SENSING_MAIL_AUTH:-true}
      SENSING_MAIL_STARTTLS: ${SENSING_MAIL_STARTTLS:-true}
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "8080:8080"

  worker:
    build: ./worker
    depends_on:
      backend:
        condition: service_started
    environment:
      SENSING_DB_DSN: postgresql://sensing:sensing@db:5432/sensing
      SENSING_MIN_INTERVAL: "2"
      SENSING_SECRET_KEY: ${SENSING_SECRET_KEY:-sensing-dev-secret}
      # 등록 시 LLM 레시피 생성 (비우면 휴리스틱 탐색만). none | anthropic | openai — README 워커 환경 변수 참고
      SENSING_LLM_PROVIDER: ${SENSING_LLM_PROVIDER:-}
      SENSING_LLM_MODEL: ${SENSING_LLM_MODEL:-}
      SENSING_LLM_BASE_URL: ${SENSING_LLM_BASE_URL:-}
      SENSING_LLM_API_KEY: ${SENSING_LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # 사내 프록시가 있으면 지정한다
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: db,localhost
    volumes:
      - workerdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  workerdata:
