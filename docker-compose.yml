# 로컬 개발·PoC용 구성: PostgreSQL(+pgvector), Spring Boot 백엔드, Python 워커
# 실행: docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sensing
      POSTGRES_USER: sensing
      POSTGRES_PASSWORD: sensing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensing -d sensing"]
      interval: 5s
      retries: 20
    command: ["postgres", "-c", "shared_buffers=1GB"]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SENSING_DB_URL: jdbc:postgresql://db:5432/sensing
      SENSING_DB_USER: sensing
      SENSING_DB_PASSWORD: sensing
      JAVA_OPTS: "-Xmx1g"
    ports:
      - "8080:8080"

  worker:
    build: ./worker
    depends_on:
      backend:
        condition: service_started
    environment:
      SENSING_DB_DSN: postgresql://sensing:sensing@db:5432/sensing
      SENSING_MIN_INTERVAL: "2"
      # 사내 프록시가 있으면 지정한다
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: db,localhost
    volumes:
      - workerdata:/app/data
    restart: unless-stopped

volumes:
  pgdata:
  workerdata:
