[project]
name = "sensing-worker"
version = "0.1.0"
description = "sensing-hub 수집 워커: 작업 큐, 수집 하네스, 자동 탐색, 추출"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# 본문 추출 품질 향상 (없으면 기본 추출기로 동작)
extract = ["trafilatura>=1.12"]
# 동적 수집 (M2)
dynamic = ["playwright>=1.47"]
# 등록 시 LLM 레시피 생성에 Claude를 쓸 때 (SENSING_LLM_PROVIDER=anthropic). OpenAI 호환 API는 추가 의존성이 없다
llm-anthropic = ["anthropic>=1"]
# 전문 검색 색인·이슈 묶기의 한국어 형태소 분석 (Kiwi). 없으면 정규식 분석기(조사 떼기)로 동작한다
nlp = ["kiwipiepy>=0.18"]
dev = ["pytest>=8.3"]

[project.scripts]
sensing-worker = "sensing_worker.main:main"
sensing-discovery-eval = "sensing_worker.evaluate:main"
sensing-robots-recheck = "sensing_worker.robots_recheck:main"
sensing-watch-backfill = "sensing_worker.backfill_watch:main"
sensing-index-backfill = "sensing_worker.indexer:main"
sensing-embed-backfill = "sensing_worker.embed:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
